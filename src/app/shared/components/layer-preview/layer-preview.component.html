<div class="container-fluid">
    <div class="row">
        <div class="col-9 p-0">
            <div id="map" class="border border-danger border-start-0 border-bottom-0 border-top-0"
                style="width: 100%; height: 584px;"></div>
        </div>
        <div class="col-3 p-0">
            <div class="" *ngIf="publishedLayers.length > 0">
                <h4 class="text-center text-secondary pt-2">Legends</h4>
                <hr>
                <div>
                    <ol *ngFor="let layer of publishedLayers">
                        <ng-container *ngIf="isLayerPublished(layer.name)">
                            <input type="checkbox" [checked]="layerVisibility[layer.name]"
                                (change)="toggleLayerVisibility(layer.name, $event)" />&nbsp;
                            <strong>{{ layerTitles[layer.name] }}</strong>
                            <img [src]="getLegendUrl(layer.name)" alt="{{ layerTitles[layer.name] }} Legend"
                                *ngIf="layerVisibility[layer.name]" /> </ng-container>
                    </ol>
                </div>
            </div>
        </div>
    </div>
</div>
